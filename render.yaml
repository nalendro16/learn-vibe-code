services:
  - type: web
    name: learn-vibe-code-api
    runtime: go
    plan: free
    branch: main
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ppob-postgres
          property: connectionString

databases:
  - name: ppob-postgres
    databaseName: ppob_db
    user: postgres
    plan: free
